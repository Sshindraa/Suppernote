name: CI

# Les pushes sur les branches de PR sont couverts par `pull_request`, pour ne lancer la suite
# complète qu'une fois. Sur `main`, seul le contrôle des secrets se rejoue après fusion ; la CI
# complète reste disponible à la demande (`workflow_dispatch`) et chaque nuit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

# Cancel in-progress runs on the same ref (save minutes on rapid pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ─────────────────────────────────────────────────────────────
  # Secret scanning: detect committed secrets before they reach prod.
  # Runs first, in parallel with packages — fails fast if a secret is found.
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  # ─────────────────────────────────────────────────────────────
  # Analyse de sécurité du code. Remplace CodeQL, indisponible sur un dépôt privé
  # sans licence GitHub Code Security. --metrics=off : le code n'est pas envoyé.
  # Règles exclues, toutes en fausses alertes ou hors sujet sur ce dépôt (tri du 04/11/2026) :
  # direct-response-write (règle Express, réponses JSON Fastify), raw-html-format (prend les
  # génériques TS pour du HTML), request-host-used (nginx), mutable-action-tag (hygiène).
  # ─────────────────────────────────────────────────────────────
  sast:
    name: Semgrep
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:1.183.0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan --metrics=off --error \
            --severity ERROR --severity WARNING \
            --config p/javascript --config p/typescript --config p/nodejs \
            --config p/react --config p/nextjs --config p/owasp-top-ten \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used \
            --exclude-rule javascript.express.security.audit.xss.direct-response-write.direct-response-write \
            --exclude-rule javascript.express.security.injection.raw-html-format.raw-html-format \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            .

  # ─────────────────────────────────────────────────────────────
  # Foundation: workspace packages typecheck + test first.
  # (prisma generate runs as part of `build`, which typecheck depends on
  #  via `^build`. tests in packages are stubs for now but the task exists
  #  so turbo's graph is uniform and ready when specs land.)
  # ─────────────────────────────────────────────────────────────
  packages:
    name: Packages (shared / config / database)
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Le contrôle de sûreté des migrations compare la branche à
          # `origin/main` : un clone superficiel ne fournit pas la référence.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Pas de `version` : pnpm/action-setup@v4 lit automatiquement
        # `packageManager` dans package.json (pnpm@10.33.3). Spécifier une
        # version fixe ici causait un mismatch "Multiple versions of pnpm
        # specified" et fail-fast en CI.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck --filter=@suppernote/shared --filter=@suppernote/config --filter=@suppernote/database

      - name: Test
        run: pnpm turbo test --filter=@suppernote/shared --filter=@suppernote/config --filter=@suppernote/database

      - name: Quality guards self-test
        # Teste la logique des garde-fous de qualification (R1-5) : cible de
        # `db push` et sûreté des migrations.
        run: |
          node scripts/quality/check-db-push-target.mjs --self-test
          node scripts/quality/check-migration-safety.mjs --self-test

      - name: Ops scripts tests
        # Tests des scripts d'exploitation qui ne sont couverts par aucun
        # autre job : runner de synchronisation, déploiement, rappel SMS.
        run: |
          node --test scripts/ops/__tests__/*.test.mjs
          bash scripts/ops/test-sync-env.sh
          bash scripts/ops/test-deploy-common.sh
          bash scripts/ops/test-apply-redis-config.sh

      - name: Migration safety guard
        # Échoue si une migration ajoutée par la branche contient un DROP /
        # TRUNCATE / DELETE sans acquittement explicite (R1-5).
        run: node scripts/quality/check-migration-safety.mjs

  # ─────────────────────────────────────────────────────────────
  # API: typecheck (turbo-orchestrated, includes workspace deps),
  # unit tests (mocks Prisma/Redis/BullMQ — no real services needed),
  # and a production build.
  # ─────────────────────────────────────────────────────────────
  api:
    name: API
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Pas de `version` : pnpm/action-setup@v4 lit automatiquement
        # `packageManager` dans package.json (pnpm@10.33.3). Spécifier une
        # version fixe ici causait un mismatch "Multiple versions of pnpm
        # specified" et fail-fast en CI.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # turbo walks the dep graph and runs typecheck for api + all
        # workspace deps (prisma generate is triggered via ^build).
        run: pnpm turbo typecheck --filter=@suppernote/api...

      - name: Lint
        # Real ESLint (flat config, type-checked rules) — catches floating
        # promises, unused vars, and misused promises that tsc misses.
        env:
          # ESLint typé sur toute l'API dépasse le tas par défaut du runner (OOM, exit 134).
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @suppernote/api lint

      - name: Tenant scoping guard
        # Échoue si un appel Prisma non scopé apparaît sur un modèle porteur
        # d'un tenant (R0-6). La baseline ne peut que baisser : voir
        # scripts/quality/tenant-scoping-baseline.json.
        run: node scripts/quality/check-tenant-scoping.mjs

      - name: Test (workspace dependencies)
        # Tests des paquets dont dépend l'API (agent-client, database…), sans l'API elle-même.
        run: pnpm turbo test --filter=@suppernote/api^...

      - name: Test with coverage
        # Un seul passage des tests de l'API : vitest --coverage (provider v8). Les seuils de
        # vitest.config.ts (lines: 60, functions: 65, branches: 55, statements: 60) bloquent la CI
        # si la couverture baisse. Le rapport est publié en artefact.
        run: pnpm turbo test:coverage --filter=@suppernote/api

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 14

      - name: Build
        run: pnpm --filter @suppernote/api build

  # ─────────────────────────────────────────────────────────────
  # API integrity: disposable Postgres + Redis. This is intentionally
  # separate from the mocked API suite so reservation concurrency,
  # exclusion constraints and append-only audit triggers are exercised on
  # every pull request instead of remaining opt-in locally.
  # ─────────────────────────────────────────────────────────────
  api-integration:
    name: API integration (Postgres)
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: read
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sokar
          POSTGRES_PASSWORD: sokar
          POSTGRES_DB: sokar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sokar -d sokar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sokar:sokar@127.0.0.1:5432/sokar_test
      REDIS_URL: redis://127.0.0.1:6379
      AGENTIC_INT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API workspace dependencies
        # Ce job s'exécute sur une machine vierge : les packages workspace et
        # le client Prisma doivent être générés avant le chargement de Vitest.
        run: pnpm turbo build --filter=@suppernote/api...

      - name: Apply disposable database migrations
        run: pnpm --filter @suppernote/database migrate:deploy

      - name: Run API integration suite
        run: pnpm --filter @suppernote/api test:int

      - name: Run marketing opt-out PostgreSQL tests
        env:
          DATABASE_URL: postgresql://sokar:sokar@127.0.0.1:5432/sokar_optout_audit_ci
          MARKETING_OPTOUT_TEST_DATABASE_URL: postgresql://sokar:sokar@127.0.0.1:5432/sokar_optout_audit_ci
          PGPASSWORD: sokar
        run: |
          createdb -h 127.0.0.1 -U sokar sokar_optout_audit_ci
          pnpm --filter @suppernote/database migrate:deploy
          pnpm --filter @suppernote/api exec vitest run src/modules/marketing/__tests__/marketing-optout.postgres.integration.test.ts

      - name: Run RGPD erasure PostgreSQL tests
        env:
          DATABASE_URL: postgresql://sokar:sokar@127.0.0.1:5432/sokar_rgpd_erasure_ci
          RGPD_ERASURE_TEST_DATABASE_URL: postgresql://sokar:sokar@127.0.0.1:5432/sokar_rgpd_erasure_ci
          PGPASSWORD: sokar
        run: |
          createdb -h 127.0.0.1 -U sokar sokar_rgpd_erasure_ci
          pnpm --filter @suppernote/database migrate:deploy
          pnpm --filter @suppernote/api exec vitest run src/modules/rgpd/__tests__/erasure.postgres.integration.test.ts src/modules/voice/__tests__/call-recording-lock.postgres.integration.test.ts src/modules/voice/__tests__/call-report-lock.postgres.integration.test.ts

      - name: Test inbound review deduplication on Redis
        env:
          REDIS_INBOUND_REVIEW_TEST_URL: redis://127.0.0.1:6379/14
        run: pnpm --filter @sokar/api exec vitest run src/modules/sms/__tests__/inbound-review.redis.integration.test.ts

  # ─────────────────────────────────────────────────────────────
  # Dashboard: ESLint CLI (flat config), TypeScript via tsc --noEmit,
  # and next build (catches server/client component boundary errors).
  # ─────────────────────────────────────────────────────────────
  dashboard:
    name: Dashboard
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Baked par `next build` : active le mode démo pour les E2E Playwright.
      # Les réponses /api/proxy sont mockées dans les specs, aucune API n'est requise.
      NEXT_PUBLIC_DEMO_RESTAURANT_ID: e2e-demo-restaurant
      NEXT_PUBLIC_DEMO_STAGING: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Pas de `version` : pnpm/action-setup@v4 lit automatiquement
        # `packageManager` dans package.json (pnpm@10.33.3). Spécifier une
        # version fixe ici causait un mismatch "Multiple versions of pnpm
        # specified" et fail-fast en CI.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck --filter=@suppernote/dashboard...

      - name: Lint
        run: pnpm --filter @suppernote/dashboard lint

      - name: CSS lint (stylelint)
        # Garde-fou CSS : interdit les sélecteurs d'éléments bruts (header, main,
        # section…), les couleurs hex, !important et les z-index arbitraires.
        # Prévient l'incident `header { position: fixed }` de juillet 2026.
        run: pnpm lint:css

      - name: Test
        run: pnpm turbo test --filter=@suppernote/dashboard...

      - name: Build
        run: pnpm --filter @suppernote/dashboard build

      - name: Playwright version (dashboard)
        id: playwright-dashboard
        run: echo "version=$(pnpm --filter @suppernote/dashboard exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Navigateur Playwright en cache (clé = version) : le téléchargement prenait jusqu'à 5 min et a déjà
      # dépassé le délai du job. Les dépendances système restent installées à chaque fois (rapide).
      - name: Cache Playwright browsers (dashboard)
        id: playwright-cache-dashboard
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-dashboard.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache-dashboard.outputs.cache-hit != 'true'
        run: pnpm --filter @suppernote/dashboard exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies (dashboard)
        if: steps.playwright-cache-dashboard.outputs.cache-hit == 'true'
        run: pnpm --filter @suppernote/dashboard exec playwright install-deps chromium

      - name: E2E tests (dashboard)
        # Garde-fou non-régression : vérifie que /dashboard se charge sans erreur
        # sur 3 viewports, que le header analytics ne chevauche pas les widgets,
        # et que les KPIs/graphiques s'affichent.
        run: pnpm test:e2e

      # ─────────────────────────────────────────────────────────────
      # RÉGRESSION VISUELLE — DÉSACTIVÉE EN CI (juillet 2026)
      #
      # Les baselines sont générés sur macOS (suffixe -darwin). En CI (Linux),
      # le rendu diffère de 1-2 % (fonts / anti-aliasing), bien au-delà du seuil
      # de 0.2 %. La copie -darwin → -linux ne suffit pas.
      #
      # Les tests visuels restent disponibles en local via `pnpm test:visual`
      # et fonctionnent correctement sur macOS.
      #
      # TODO (follow-up) : générer des baselines Linux dédiés via un workflow
      # CI qui capture et commit les baselines, ou utiliser un seuil adapté
      # par plateforme. Voir PR #2 discussion.
      # ─────────────────────────────────────────────────────────────
      - name: Préparer les baselines visuels pour Linux
        if: false
        run: |
          cd apps/dashboard/e2e/__snapshots__/visual-regression.spec.ts-snapshots/
          for f in *-darwin.png; do
            linux="${f%-darwin.png}-linux.png"
            cp "$f" "$linux"
          done

      - name: Visual regression tests (dashboard)
        if: false
        run: pnpm test:visual

      - name: Upload visual diff artifacts
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 14

  connect:
    name: Sokar Connect
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Pas de `version` : pnpm/action-setup@v4 lit automatiquement
        # `packageManager` dans package.json (pnpm@10.33.3). Spécifier une
        # version fixe ici causait un mismatch "Multiple versions of pnpm
        # specified" et fail-fast en CI.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck --filter=@suppernote/connect...

      - name: Lint
        run: pnpm --filter @suppernote/connect lint

      - name: Test
        run: pnpm turbo test --filter=@suppernote/connect...

      - name: Build
        run: pnpm --filter @suppernote/connect build

  # ─────────────────────────────────────────────────────────────
  # Sokar Connect E2E: real Fastify API + seeded Postgres + Redis.
  #
  # The public booking surface is the commercial front door, so these flows
  # must run on every pull request instead of skipping when no API is
  # reachable. The specs fail (rather than skip) when `CI` is set and the API
  # is missing, which is what makes this job meaningful.
  # ─────────────────────────────────────────────────────────────
  connect-e2e:
    name: Sokar Connect e2e
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: read
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sokar
          POSTGRES_PASSWORD: sokar
          POSTGRES_DB: sokar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sokar -d sokar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sokar:sokar@127.0.0.1:5432/sokar_test
      REDIS_URL: redis://127.0.0.1:6379
      # Lu par le serveur Next de Connect (fetch SSR) et par les specs
      # (sonde /health). Sans cette variable, Connect appellerait :3001.
      API_URL: http://localhost:4000
      # Les composants client sont compilés avec NEXT_PUBLIC_* ; sans cette
      # variable, les parcours réservation et carte cadeau visent :3001.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Connect tourne sur 4002 dans ce job ; l'origine doit être autorisée
      # par Fastify pour que les fetch navigateur ne soient pas bloqués par CORS.
      CORS_ORIGINS: http://localhost:4002,http://127.0.0.1:4002
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API workspace dependencies
        # Génère le client Prisma et compile l'API : `start` exécute dist/main.js.
        run: pnpm turbo build --filter=@suppernote/api...

      - name: Apply disposable database migrations
        run: pnpm --filter @suppernote/database migrate:deploy

      - name: Seed demo restaurant and floor plan
        # Le seed publie `chez-sokar-demo` (Connect) ; le plan de salle fournit
        # les tables sans lesquelles l'endpoint de disponibilité ne renvoie
        # aucun créneau et le parcours de réservation ne serait pas exerçable.
        run: |
          pnpm --filter @suppernote/database seed
          pnpm --filter @suppernote/database seed:floor-plan

      - name: Start API
        run: |
          nohup pnpm --filter @suppernote/api start > /tmp/sokar-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 60s"
          tail -n 120 /tmp/sokar-api.log
          exit 1

      - name: Playwright version (connect)
        id: playwright-connect
        run: echo "version=$(pnpm --filter @suppernote/connect exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Navigateur Playwright en cache (clé = version) : le téléchargement prenait jusqu'à 5 min et a déjà
      # dépassé le délai du job. Les dépendances système restent installées à chaque fois (rapide).
      - name: Cache Playwright browsers (connect)
        id: playwright-cache-connect
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-connect.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache-connect.outputs.cache-hit != 'true'
        run: pnpm --filter @suppernote/connect exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies (connect)
        if: steps.playwright-cache-connect.outputs.cache-hit == 'true'
        run: pnpm --filter @suppernote/connect exec playwright install-deps chromium

      - name: E2E tests (Connect)
        run: pnpm --filter @suppernote/connect test:e2e

      - name: API logs on failure
        if: failure()
        run: tail -n 200 /tmp/sokar-api.log
