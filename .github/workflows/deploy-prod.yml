name: Deploy Production

on:
  workflow_run:
    workflows: [Deploy Staging]
    types: [completed]
    branches: [main]
  workflow_dispatch: # déclenchement manuel (fallback)

# Évite les déploiements concurrents en production.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Deploy to production VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Dépôt privé et aucun accès GitHub sur le VPS : le runner lui envoie main en bundle.
      # shortcut: bundle complet (~60 Mo) à chaque déploiement, à rendre incrémental s'il devient lent.
      - name: Bundle main
        run: git bundle create sokar-main.bundle refs/heads/main

      - name: Copy bundle to production host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: sokar-main.bundle
          target: /tmp/
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          RESEND_RATE_LIMIT_REDIS_URL: ${{ secrets.RESEND_RATE_LIMIT_REDIS_URL }}
          DEMO_REQUEST_NOTIFY_TO: ${{ secrets.DEMO_REQUEST_NOTIFY_TO }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_SMS_TO: ${{ secrets.ALERT_SMS_TO }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          RESERVATION_SERVICE_TOKEN: ${{ secrets.RESERVATION_SERVICE_TOKEN }}
          STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRODUCTION_ESSENTIAL_MONTHLY }}
          STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_PRODUCTION_ESSENTIAL_ANNUAL }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_PRODUCTION_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_ANNUAL: ${{ vars.STRIPE_PRODUCTION_PRO_ANNUAL }}
          STRIPE_PRICE_MULTI_SITE_MONTHLY: ${{ vars.STRIPE_PRODUCTION_MULTI_SITE_MONTHLY }}
          STRIPE_PRICE_MULTI_SITE_ANNUAL: ${{ vars.STRIPE_PRODUCTION_MULTI_SITE_ANNUAL }}
          STRIPE_PRICE_MULTI_SITE_ADDON_MONTHLY: ${{ vars.STRIPE_PRODUCTION_MULTI_SITE_ADDON_MONTHLY }}
          STRIPE_PRICE_MULTI_SITE_ADDON_ANNUAL: ${{ vars.STRIPE_PRODUCTION_MULTI_SITE_ADDON_ANNUAL }}
          SOKAR_OPERATOR_USER_IDS: ${{ vars.SOKAR_OPERATOR_USER_IDS }}
          # Chez Sokar : Ink-2 fournit le texte, Deepgram décide la fin de phrase.
          VOICE_STT_INK_RESTAURANT_IDS: 710309f4-d699-472d-a1db-f22d527fc4d0
          VOICE_STT_INK_REPLACE_RESTAURANT_IDS: 710309f4-d699-472d-a1db-f22d527fc4d0
          # Phase 1 naturel : qualification Chez Sokar, aucun restaurant client.
          VOICE_CONVERSATION_CONTINUITY_RESTAURANT_IDS: 710309f4-d699-472d-a1db-f22d527fc4d0
          DEPLOY_EVENT: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          # Prod et staging sont sur le même VPS → on réutilise STAGING_*.
          # Si un jour prod a son propre VPS, créer PROD_HOST/PROD_SSH_KEY/PROD_USER.
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 18m
          envs: ALERT_WEBHOOK,HEALTHCHECKS_PING_URL,SENTRY_DSN,ALERT_EMAIL_TO,ALERT_WEBHOOK_URL,ALERT_SMS_TO,GRAFANA_ADMIN_PASSWORD,RESERVATION_SERVICE_TOKEN,STRIPE_PRICE_ESSENTIAL_MONTHLY,STRIPE_PRICE_ESSENTIAL_ANNUAL,STRIPE_PRICE_PRO_MONTHLY,STRIPE_PRICE_PRO_ANNUAL,STRIPE_PRICE_MULTI_SITE_MONTHLY,STRIPE_PRICE_MULTI_SITE_ANNUAL,STRIPE_PRICE_MULTI_SITE_ADDON_MONTHLY,STRIPE_PRICE_MULTI_SITE_ADDON_ANNUAL,SOKAR_OPERATOR_USER_IDS,VOICE_STT_INK_RESTAURANT_IDS,VOICE_STT_INK_REPLACE_RESTAURANT_IDS,VOICE_CONVERSATION_CONTINUITY_RESTAURANT_IDS,DEPLOY_EVENT,TRIGGER_SHA,DEMO_REQUEST_NOTIFY_TO,RESEND_RATE_LIMIT_REDIS_URL
          script: |
            set -euo pipefail
            cd /opt/sokar
            git checkout main
            git fetch /tmp/sokar-main.bundle +refs/heads/main:refs/remotes/origin/main
            rm -f /tmp/sokar-main.bundle
            git reset --hard origin/main
            git clean -fd
            # Évite les déploiements redondants (incident 2026-09-27 : deux runs
            # staging rapprochés → deux déploiements prod du même commit, et une
            # seconde fenêtre d'indisponibilité des assets). Un run manuel
            # (workflow_dispatch) n'est jamais sauté.
            TARGET_SHA="$(git rev-parse HEAD)"
            ACTIVE_SHA="$(cat releases/.latest-hash 2>/dev/null || true)"
            if [ "${DEPLOY_EVENT:-}" = "workflow_run" ]; then
              if [ -n "${TRIGGER_SHA:-}" ] && [ "$TRIGGER_SHA" != "$TARGET_SHA" ]; then
                echo "Skip : le run staging déclencheur ($TRIGGER_SHA) n'est plus la tête de main ($TARGET_SHA) ; le run suivant déploiera."
                exit 0
              fi
              if [ "$ACTIVE_SHA" = "$TARGET_SHA" ]; then
                echo "Skip : $TARGET_SHA est déjà la release active en production."
                exit 0
              fi
            fi
            if [ ! -x /usr/local/sbin/sokar-deploy-root ]; then
              sudo install -o root -g root -m 0755 \
                scripts/ops/sokar-deploy-root.sh /usr/local/sbin/sokar-deploy-root
            fi
            sudo /usr/local/sbin/sokar-deploy-root self-update prod
            if [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
              echo "GRAFANA_ADMIN_PASSWORD secret is required for production Grafana" >&2
              exit 1
            fi
            printf 'GRAFANA_ADMIN_PASSWORD\t%s\n' "$GRAFANA_ADMIN_PASSWORD" | \
              sudo /usr/local/sbin/sokar-deploy-root configure-grafana prod
            sudo /usr/local/sbin/sokar-deploy-root validate-monitoring prod
            source scripts/ops/deploy-common.sh
            api_env_before="$(api_env_fingerprint apps/api/.env)"
            if [ -n "${SENTRY_DSN:-}${ALERT_EMAIL_TO:-}${ALERT_WEBHOOK_URL:-}${ALERT_SMS_TO:-}${RESEND_RATE_LIMIT_REDIS_URL:-}" ]; then
              bash scripts/ops/sync-env.sh alerting prod
            fi
            if [ -n "${DEMO_REQUEST_NOTIFY_TO:-}" ]; then
              bash scripts/ops/sync-env.sh demo-request prod
            fi
            if [ -n "${RESERVATION_SERVICE_TOKEN:-}" ]; then
              bash scripts/ops/sync-env.sh reservation prod
            fi
            bash scripts/ops/sync-env.sh operator prod
            bash scripts/ops/sync-env.sh voice-stt prod
            if [ -n "${ALERT_WEBHOOK:-}${HEALTHCHECKS_PING_URL:-}" ]; then
              {
                printf 'ALERT_WEBHOOK\t%s\n' "${ALERT_WEBHOOK:-}"
                printf 'HEALTHCHECKS_PING_URL\t%s\n' "${HEALTHCHECKS_PING_URL:-}"
              } | sudo /usr/local/sbin/sokar-deploy-root configure-watchdog prod
            fi
            bash scripts/ops/sync-env.sh stripe-prices prod
            SOKAR_API_ENV_BEFORE="$api_env_before" SOKAR_SKIP_GIT_PULL=1 bash scripts/deploy.sh --env prod --confirm-production
            sudo /usr/local/sbin/sokar-deploy-root start-prometheus prod
            sudo /usr/local/sbin/sokar-deploy-root start-grafana prod

  smoke-tests:
    name: Smoke tests against production
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Curl health endpoints
        run: |
          set -euo pipefail

          PROD_URL="https://suppernote.com"
          API_PROD_URL="https://api.suppernote.com"

          echo "=== Health checks ==="

          # Exercise the primary-domain routing, not only the API hostname.
          for PUBLIC_PATH in /public/widget/chez-suppernote-demo /public/widget/chez-sokar-demo /public/gift-cards/packs/chez-suppernote-demo /public/gift-cards/packs/chez-sokar-demo /gift-card/sokar-route-smoke; do
            PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PROD_URL$PUBLIC_PATH")
            echo "$PUBLIC_PATH → $PUBLIC_STATUS"
            [ "$PUBLIC_STATUS" = "200" ] || exit 1
          done


          # /health via api.suppernote.com
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$API_PROD_URL/health" || echo "FAIL")
          echo "api.suppernote.com/health → $HEALTH_STATUS"
          [ "$HEALTH_STATUS" = "200" ] || exit 1

          # /livez via api.suppernote.com
          LIVEZ_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$API_PROD_URL/livez" || echo "FAIL")
          echo "api.suppernote.com/livez → $LIVEZ_STATUS"
          [ "$LIVEZ_STATUS" = "200" ] || exit 1

          # La route legacy doit rester protégée et refuser avant toute
          # validation ou écriture lorsqu'aucun jeton de service n'est fourni.
          LEGACY_RESERVATION_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 -X POST -H "content-type: application/json" -d '{}' \
            "$API_PROD_URL/reservations" || echo "FAIL")
          echo "api.suppernote.com/reservations sans jeton → $LEGACY_RESERVATION_STATUS"
          [ "$LEGACY_RESERVATION_STATUS" = "401" ] || exit 1

          # /dashboard — peut rediriger vers Clerk (302) ou répondre 200.
          # On accepte 200 et 302 comme valides.
          DASH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 -L "$PROD_URL/dashboard" || echo "FAIL")
          echo "suppernote.com/dashboard → $DASH_STATUS"
          [ "$DASH_STATUS" = "200" ] || [ "$DASH_STATUS" = "302" ] || exit 1

          # Page d'accueil
          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$PROD_URL/" || echo "FAIL")
          echo "suppernote.com/ → $HOME_STATUS"
          [ "$HOME_STATUS" = "200" ] || exit 1

          # Suppernote Connect page
          for DEMO_SLUG in chez-suppernote-demo chez-sokar-demo; do
            CONNECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 "$PROD_URL/restaurant/$DEMO_SLUG" || echo "FAIL")
            echo "suppernote.com/restaurant/$DEMO_SLUG → $CONNECT_STATUS"
            [ "$CONNECT_STATUS" = "200" ] || exit 1
          done

          # Subdomain routing — verify *.suppernote.com resolves to the restaurant page
          # (not the landing page). Catches Nginx default_server and middleware bugs.
          SUBDOMAIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 -H "Host: chez-sokar-demo.suppernote.com" "https://suppernote.com/" || echo "FAIL")
          echo "chez-sokar-demo.suppernote.com (via Host header) → $SUBDOMAIN_STATUS"
          [ "$SUBDOMAIN_STATUS" = "200" ] || exit 1

          SUPPERNOTE_SUBDOMAIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 -H "Host: chez-suppernote-demo.suppernote.com" "https://suppernote.com/" || echo "FAIL")
          echo "chez-suppernote-demo.suppernote.com (via Host header) → $SUPPERNOTE_SUBDOMAIN_STATUS"
          [ "$SUPPERNOTE_SUBDOMAIN_STATUS" = "200" ] || exit 1

          # Verify content is the restaurant page, not the landing page
          SUBDOMAIN_CONTENT=$(curl -s --max-time 10 \
            -H "Host: chez-sokar-demo.suppernote.com" "https://suppernote.com/" || echo "")
          # Check for restaurant page title pattern (more stable than body copy).
          # The restaurant page title always contains "Réservation" — the landing page doesn't.
          if echo "$SUBDOMAIN_CONTENT" | grep -q "<title>.*Réservation"; then
            echo "Subdomain content: restaurant page ✅"
          else
            echo "Subdomain content: WRONG (expected restaurant page, got landing page)"
            exit 1
          fi

          # /pricing doit être servi avec sa CSS (incident 2026-09-27 : CSS en 400).
          PRICING_HTML=$(curl -s --max-time 10 "$PROD_URL/pricing" || echo "")
          PRICING_CSS=$(printf '%s' "$PRICING_HTML" \
            | grep -oE '/_next/static/css/[^"]+\.css' | head -1 || true)
          if [ -z "$PRICING_CSS" ]; then
            echo "suppernote.com/pricing → aucune feuille CSS dans le HTML"
            exit 1
          fi
          PRICING_CSS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$PROD_URL$PRICING_CSS" || echo "FAIL")
          echo "suppernote.com$PRICING_CSS → $PRICING_CSS_STATUS"
          [ "$PRICING_CSS_STATUS" = "200" ] || exit 1

          echo ""
          echo "✅ All production smoke tests passed"
