name: Deploy Staging

# Déclenché directement par la fusion sur `main` : la CI complète n'est plus relancée sur `main`
# (≈ 6 min). Le job `verify-ci` remplace cette relance par une preuve : le commit doit venir d'une
# PR fusionnée dont l'arbre est identique à sa tête et dont les six checks requis sont verts.
# Sans preuve, rien n'est déployé. Prod suit toujours le succès de ce workflow (deploy-prod.yml).
on:
  push:
    branches: [main]
  workflow_dispatch: # déclenchement manuel
    inputs:
      force_smoke_failure:
        description: 'Échouer volontairement après les smoke tests pour prouver le blocage de promotion'
        required: false
        type: boolean
        default: false
      run_demo_slug_migration:
        description: 'Après tous les smoke tests, canoniser le slug du restaurant de démonstration en staging'
        required: false
        type: boolean
        default: false

# Évite les déploiements concurrents sur staging.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Prouve que ce commit a déjà passé la CI complète sur la PR. Ignoré pour un
  # déclenchement manuel, qui reste un choix explicite de l'opérateur.
  verify-ci:
    name: Preuve de CI verte
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier l'arbre fusionné et les vérifications de la PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ops/verify-merged-tree-ci.mjs "${{ github.sha }}"

  deploy:
    name: Deploy to staging VPS
    needs: verify-ci
    if: >-
      !cancelled() && !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.verify-ci.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Dépôt privé et aucun accès GitHub sur le VPS : le runner lui envoie l'archive du commit.
      - name: Archive source
        run: git archive --format=tar.gz --prefix=source/ -o sokar-staging-source.tar.gz "$GITHUB_SHA"

      - name: Copy source to staging host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: sokar-staging-source.tar.gz
          target: /tmp/
          overwrite: true

      - name: Prepare Clerk secret transfer
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          case "$CLERK_SECRET_KEY" in
            sk_test_*) ;;
            *)
              echo "::error::CLERK_SECRET_KEY doit être une clé Clerk Development (sk_test_*)"
              exit 1
              ;;
          esac
          umask 077
          printf '%s' "$CLERK_SECRET_KEY" > sokar-clerk-secret
          chmod 0600 sokar-clerk-secret

      - name: Copy Clerk secret to staging host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: sokar-clerk-secret
          target: /tmp/
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          RESEND_RATE_LIMIT_REDIS_URL: ${{ secrets.RESEND_RATE_LIMIT_REDIS_URL }}
          DEMO_REQUEST_NOTIFY_TO: ${{ secrets.DEMO_REQUEST_NOTIFY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_STAGING }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM_STAGING }}
          EMAIL_TEST_ALLOWLIST: ${{ vars.EMAIL_TEST_ALLOWLIST_STAGING }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL_STAGING }}
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY_STAGING }}
          TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY_STAGING }}
          TELNYX_CONNECTION_ID: ${{ vars.TELNYX_CONNECTION_ID_STAGING }}
          TELNYX_FROM_NUMBER: ${{ secrets.TELNYX_FROM_NUMBER_STAGING }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_SMS_TO: ${{ secrets.ALERT_SMS_TO }}
          RESERVATION_SERVICE_TOKEN: ${{ secrets.RESERVATION_SERVICE_TOKEN }}
          STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_STAGING_ESSENTIAL_MONTHLY }}
          STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_STAGING_ESSENTIAL_ANNUAL }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_STAGING_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_ANNUAL: ${{ vars.STRIPE_STAGING_PRO_ANNUAL }}
          STRIPE_PRICE_MULTI_SITE_MONTHLY: ${{ vars.STRIPE_STAGING_MULTI_SITE_MONTHLY }}
          STRIPE_PRICE_MULTI_SITE_ANNUAL: ${{ vars.STRIPE_STAGING_MULTI_SITE_ANNUAL }}
          STRIPE_PRICE_MULTI_SITE_ADDON_MONTHLY: ${{ vars.STRIPE_STAGING_MULTI_SITE_ADDON_MONTHLY }}
          STRIPE_PRICE_MULTI_SITE_ADDON_ANNUAL: ${{ vars.STRIPE_STAGING_MULTI_SITE_ADDON_ANNUAL }}
          SOKAR_OPERATOR_USER_IDS: ${{ vars.SOKAR_OPERATOR_USER_IDS_STAGING || vars.SOKAR_OPERATOR_USER_IDS }}
          # Phase 1 naturel : qualification du restaurant de test uniquement.
          VOICE_CONVERSATION_CONTINUITY_RESTAURANT_IDS: ${{ vars.STAGING_DEMO_RESTAURANT_ID }}
          NEXT_PUBLIC_DEMO_RESTAURANT_ID: ${{ vars.STAGING_DEMO_RESTAURANT_ID }}
          NEXT_PUBLIC_DEMO_STAGING: '1'
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 18m
          envs: ALERT_WEBHOOK,SENTRY_DSN,ALERT_EMAIL_TO,ALERT_WEBHOOK_URL,ALERT_SMS_TO,RESERVATION_SERVICE_TOKEN,STRIPE_PRICE_ESSENTIAL_MONTHLY,STRIPE_PRICE_ESSENTIAL_ANNUAL,STRIPE_PRICE_PRO_MONTHLY,STRIPE_PRICE_PRO_ANNUAL,STRIPE_PRICE_MULTI_SITE_MONTHLY,STRIPE_PRICE_MULTI_SITE_ANNUAL,STRIPE_PRICE_MULTI_SITE_ADDON_MONTHLY,STRIPE_PRICE_MULTI_SITE_ADDON_ANNUAL,SOKAR_OPERATOR_USER_IDS,VOICE_CONVERSATION_CONTINUITY_RESTAURANT_IDS,NEXT_PUBLIC_DEMO_RESTAURANT_ID,NEXT_PUBLIC_DEMO_STAGING,DEMO_REQUEST_NOTIFY_TO,RESEND_API_KEY,EMAIL_FROM,TELNYX_API_KEY,TELNYX_PUBLIC_KEY,TELNYX_CONNECTION_ID,TELNYX_FROM_NUMBER,EMAIL_TEST_ALLOWLIST,PUBLIC_API_URL,RESEND_RATE_LIMIT_REDIS_URL
          script: |
            set -euo pipefail
            cd /opt/sokar-staging
            CLERK_SECRET_FILE=/tmp/sokar-clerk-secret
            cleanup() {
              rm -f "$CLERK_SECRET_FILE"
              rm -rf "${SOURCE_TMP:-}"
            }
            trap cleanup EXIT
            test "${NEXT_PUBLIC_DEMO_STAGING:-}" = "1"
            [[ "${NEXT_PUBLIC_DEMO_RESTAURANT_ID:-}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]
            git checkout main
            # Le VPS n'a aucun accès GitHub : le runner a copié l'archive du commit exact
            # dans /tmp. On en crée un snapshot Git local pour conserver les rollbacks/hash.
            SOURCE_SHA="${{ github.sha }}"
            [[ "$SOURCE_SHA" =~ ^[[:xdigit:]]{40}$ ]]
            git reset --hard
            git clean -fd -e releases/
            SOURCE_TMP=$(mktemp -d /tmp/sokar-staging-source.XXXXXX)
            mv /tmp/sokar-staging-source.tar.gz "$SOURCE_TMP/source.tar.gz"
            mkdir "$SOURCE_TMP/tree"
            tar -xzf "$SOURCE_TMP/source.tar.gz" --strip-components=1 -C "$SOURCE_TMP/tree"
            while IFS= read -r -d '' tracked_path; do
              if [ ! -e "$SOURCE_TMP/tree/$tracked_path" ] && [ ! -L "$SOURCE_TMP/tree/$tracked_path" ]; then
                rm -f -- "$tracked_path"
              fi
            done < <(git ls-files -z)
            cp -a "$SOURCE_TMP/tree/." .
            git add --all
            if ! git diff --cached --quiet; then
              # Le snapshot reprend un commit déjà validé par la CI (dont le
              # secret scanning) : les hooks husky locaux n'ont rien à y
              # contrôler, et leur heuristique anti-secret bloquait le
              # déploiement sur les clés factices des tests.
              HUSKY=0 git -c user.name='Sokar staging snapshot' \
                -c user.email='deploy@suppernote.com' \
                commit --no-verify -m "chore(staging): snapshot ${SOURCE_SHA}"
            fi
            git status --short
            if [ ! -x /usr/local/sbin/sokar-deploy-root ]; then
              sudo install -o root -g root -m 0755 \
                scripts/ops/sokar-deploy-root.sh /usr/local/sbin/sokar-deploy-root
            fi
            source scripts/ops/deploy-common.sh
            api_env_before="$(api_env_fingerprint apps/api/.env)"
            if [ -n "${SENTRY_DSN:-}${ALERT_EMAIL_TO:-}${ALERT_WEBHOOK_URL:-}${ALERT_SMS_TO:-}${RESEND_RATE_LIMIT_REDIS_URL:-}" ]; then
              bash scripts/ops/sync-env.sh alerting staging
            fi
            if [ -n "${DEMO_REQUEST_NOTIFY_TO:-}" ]; then
              bash scripts/ops/sync-env.sh demo-request staging
            fi
            if [ -n "${RESEND_API_KEY:-}${EMAIL_FROM:-}${EMAIL_TEST_ALLOWLIST:-}${PUBLIC_API_URL:-}${TELNYX_API_KEY:-}${TELNYX_PUBLIC_KEY:-}${TELNYX_CONNECTION_ID:-}${TELNYX_FROM_NUMBER:-}" ]; then
              bash scripts/ops/sync-env.sh provider staging
            fi
            if [ -n "${RESERVATION_SERVICE_TOKEN:-}" ]; then
              bash scripts/ops/sync-env.sh reservation staging
            fi
            bash scripts/ops/sync-env.sh operator staging
            bash scripts/ops/sync-env.sh voice-stt staging
            test -s "$CLERK_SECRET_FILE"
            chmod 0600 "$CLERK_SECRET_FILE"
            CLERK_SECRET_KEY=$(cat "$CLERK_SECRET_FILE")
            export CLERK_SECRET_KEY
            bash scripts/ops/sync-env.sh clerk staging
            bash scripts/ops/sync-env.sh stripe-prices staging
            SOKAR_API_ENV_BEFORE="$api_env_before" SOKAR_SKIP_GIT_PULL=1 bash scripts/deploy.sh --env staging

      - name: Remove remote Clerk secret transport file
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            rm -f /tmp/sokar-clerk-secret

      - name: Remove runner Clerk secret transport file
        if: always()
        run: rm -f sokar-clerk-secret

  smoke-tests:
    name: Smoke tests against staging
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Curl health endpoints
        run: |
          set -euo pipefail

          STAGING_URL="https://staging.suppernote.com"
          API_STAGING_URL="https://api-staging.suppernote.com"

          echo "=== Health checks ==="

          # Exercise the primary-domain routing, not only the API hostname.
          for PUBLIC_PATH in /public/widget/chez-suppernote-demo /public/widget/chez-sokar-demo /public/gift-cards/packs/chez-suppernote-demo /public/gift-cards/packs/chez-sokar-demo /gift-card/sokar-route-smoke; do
            PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$STAGING_URL$PUBLIC_PATH")
            echo "$PUBLIC_PATH → $PUBLIC_STATUS"
            [ "$PUBLIC_STATUS" = "200" ] || exit 1
          done


          # /health via api-staging.suppernote.com
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$API_STAGING_URL/health" || echo "FAIL")
          echo "api-staging.suppernote.com/health → $HEALTH_STATUS"
          [ "$HEALTH_STATUS" = "200" ] || exit 1

          # /livez via api-staging.suppernote.com
          LIVEZ_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$API_STAGING_URL/livez" || echo "FAIL")
          echo "api-staging.suppernote.com/livez → $LIVEZ_STATUS"
          [ "$LIVEZ_STATUS" = "200" ] || exit 1

          # La route legacy doit rester protégée et refuser avant toute
          # validation ou écriture lorsqu'aucun jeton de service n'est fourni.
          LEGACY_RESERVATION_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 -X POST -H "content-type: application/json" -d '{}' \
            "$API_STAGING_URL/reservations" || echo "FAIL")
          echo "api-staging.suppernote.com/reservations sans jeton → $LEGACY_RESERVATION_STATUS"
          [ "$LEGACY_RESERVATION_STATUS" = "401" ] || exit 1

          # /dashboard — peut rediriger vers Clerk (302) ou répondre 200.
          # On accepte 200 et 302 comme valides.
          DASH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 -L "$STAGING_URL/dashboard" || echo "FAIL")
          echo "staging.suppernote.com/dashboard → $DASH_STATUS"
          [ "$DASH_STATUS" = "200" ] || [ "$DASH_STATUS" = "302" ] || exit 1

          # Page d'accueil
          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$STAGING_URL/" || echo "FAIL")
          echo "staging.suppernote.com/ → $HOME_STATUS"
          [ "$HOME_STATUS" = "200" ] || exit 1

          # Suppernote Connect page
          for DEMO_SLUG in chez-suppernote-demo chez-sokar-demo; do
            CONNECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 "$STAGING_URL/restaurant/$DEMO_SLUG" || echo "FAIL")
            echo "staging.suppernote.com/restaurant/$DEMO_SLUG → $CONNECT_STATUS"
            [ "$CONNECT_STATUS" = "200" ] || exit 1
          done

          echo ""
          echo "✅ All smoke tests passed"

      - name: Test rollback staging
        if: success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            bash /opt/sokar-staging/scripts/deploy.sh --env staging rollback
        continue-on-error: true

      - name: Verify rollback health
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        run: |
          sleep 5
          curl -fsS https://api-staging.suppernote.com/livez || exit 1

      - name: Restore current staging release
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            latest=$(tr -d '[:space:]' < /opt/sokar-staging/releases/.latest)
            test -n "$latest"
            # Le test de rollback restaure l’avant-dernière release ;
            # remettre explicitement la release courante évite de laisser
            # staging servir un artefact historique après un workflow vert.
            bash /opt/sokar-staging/scripts/deploy.sh --env staging rollback "$latest"

      - name: Playwright E2E smoke test
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @suppernote/dashboard exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Navigateur Playwright en cache (clé = version), partagé avec la CI : environ 1 min de téléchargement en moins.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @suppernote/dashboard exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @suppernote/dashboard exec playwright install-deps chromium

      - name: Run E2E against staging
        env:
          PLAYWRIGHT_BASE_URL: https://staging.suppernote.com
        run: |
          cd apps/dashboard
          # Run only the functional E2E tests (not visual regression) against
          # the staging URL. The PLAYWRIGHT_BASE_URL env var overrides the
          # dev server baseURL in playwright.config.ts.
          pnpm exec playwright test dashboard.spec.ts widget.spec.ts --project=desktop-1440 \
            --reporter=list
          echo "Dashboard E2E smoke test completed (blocking)"

      - name: Install Connect Playwright browsers
        run: pnpm --filter @suppernote/connect exec playwright install --with-deps chromium

      - name: Run Connect E2E smoke against staging
        env:
          PLAYWRIGHT_BASE_URL: https://staging.suppernote.com
          API_URL: https://api-staging.suppernote.com
        run: |
          cd apps/connect
          # La fiche publique est servie par Connect. Le widget de réservation
          # (/widget/[slug]) est servi par Dashboard et est testé juste au-dessus.
          pnpm exec playwright test restaurant-page.spec.ts --project=desktop-1280 \
            --reporter=list
          echo "Connect E2E smoke test completed (blocking)"

      - name: Intentional promotion gate failure (proof only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_smoke_failure == true }}
        run: |
          echo "Intentional staging failure requested: production promotion must remain skipped."
          exit 1

      - name: Migrate staging demo slug
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_demo_slug_migration == true }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/sokar-staging
            DATABASE_URL=$(grep '^DATABASE_URL=' apps/api/.env | cut -d= -f2- | sed "s/^[\"'[:space:]]*//;s/[\"'[:space:]]*$//")
            case "$DATABASE_URL" in
              *sokar_staging*) ;;
              *) echo "Refusing demo slug migration: target is not sokar_staging."; exit 1 ;;
            esac
            pnpm exec prisma db execute --url="$DATABASE_URL" \
              --file=packages/database/prisma/scripts/migrate-demo-slug.sql
            echo "Staging database contains the canonical demo slug only."

      - name: Verify both demo slugs after migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_demo_slug_migration == true }}
        run: |
          set -euo pipefail
          for DEMO_SLUG in chez-suppernote-demo chez-sokar-demo; do
            for URL in \
              "https://staging.suppernote.com/restaurant/$DEMO_SLUG" \
              "https://api-staging.suppernote.com/public/widget/$DEMO_SLUG" \
              "https://staging.suppernote.com/public/gift-cards/packs/$DEMO_SLUG"; do
              STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || echo FAIL)
              echo "$URL → $STATUS"
              test "$STATUS" = 200
            done
          done
