# Suppernote STAGING reverse proxy.
#
# Miroir de sokar.conf (prod) mais sur les ports staging :
#   API      → 127.0.0.1:4100
#   Dashboard → 127.0.0.1:3100
#   Connect  → 127.0.0.1:4102
#
# Domaines :
#   staging.suppernote.com     → dashboard (avec /api/ → API, /restaurant/ → connect)
#   api-staging.suppernote.com → API directe (WebSockets inclus)
#
# TLS : utilise un certificat dédié staging (chemin Let's Encrypt par défaut).
# Le certificat doit couvrir staging.suppernote.com et api-staging.suppernote.com.
# Certbot : certbot certonly --nginx -d staging.suppernote.com -d api-staging.suppernote.com

map $http_upgrade $connection_upgrade_staging {
    default upgrade;
    ''      close;
}

# Rate limits nginx (protection avant l'API Fastify).
# Zones staging distinctes de prod pour éviter les conflits de nom.
limit_req_zone $binary_remote_addr zone=connect_hold_staging:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=connect_confirm_staging:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=connect_public_staging:10m rate=120r/m;

upstream sokar_staging_dashboard {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream sokar_staging_api {
    server 127.0.0.1:4100;
    keepalive 16;
}

upstream sokar_staging_connect {
    server 127.0.0.1:4102;
    keepalive 8;
}

# ── staging.suppernote.com : dashboard + API + connect ───────
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.suppernote.com;

    ssl_certificate /etc/letsencrypt/live/suppernote.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suppernote.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Next.js route handlers (proxy dashboard).
    location = /api/proxy/api/rgpd/confirm-link {
        access_log off;
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    location = /api/rgpd/confirm-link {
        access_log off;
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    location ^~ /api/proxy/ {
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    # Same-origin public clients: explicit route families, no internal API proxy.
    location ~ ^/public/r/[^/]+/hold$ {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
        limit_req zone=connect_hold_staging burst=5 nodelay;
    }
    location ~ ^/public/r/[^/]+/confirm$ {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
        limit_req zone=connect_confirm_staging burst=5 nodelay;
    }
    location ~ ^/public/(gift-cards|r|widget)(/|$) {
        limit_req zone=connect_public_staging burst=20 nodelay;
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/sokar-security-headers.conf;
    }
    location = /public/analytics/events {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }
    location = /marketing/attribution/click {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }
    location ^~ /gift-card/ {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/sokar-security-headers.conf;
    }

    location = /api/auth/sync {
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    # Personal booking access stays on the dashboard, not the generic API prefix.
    location = /api/reservation-management {
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    location = /r {
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    # Fastify endpoints.
    location ^~ /api/ {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    # Suppernote Connect — /r/[slug] legacy redirect (cf. apps/connect/next.config.js)
    location ^~ /r/ {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_read_timeout 30s;
    }

    # Suppernote Connect pages.
    location ^~ /restaurant/ {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_read_timeout 30s;
    }

    location ^~ /restaurants/ {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_read_timeout 30s;
    }

    location = /sitemap.xml {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    location = /robots.txt {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    # Match production: this document belongs to Connect, not the dashboard RSC router.
    location = /privacy {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    # Embeddable widget snippet — served by Suppernote Connect (apps/connect/public/embed.js).
    # Cache modéré (1h) : le snippet change rarement mais doit pouvoir être mis à jour
    # sans attendre un TTL long. Cloudflare purge le cache amont au déploiement.
    location = /embed.js {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
        expires 1h;
        # add_header in a location disables inheritance of the server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /connect-assets/ {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
        expires 1y;
        # add_header in a location disables inheritance of the server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Widget pages (iframe-embeddable).
    location ~ ^/widget/[^/]+/gift-card$ {
        proxy_pass http://sokar_staging_connect;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        # add_header in a location disables inheritance of the server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors *; base-uri 'self'; form-action 'self' https://hooks.stripe.com" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_read_timeout 30s;
    }

    location ~ ^/widget/[^/]+$ {
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        # add_header in a location disables inheritance of the server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_read_timeout 30s;
    }

    location ~ ^/book/[^/]+$ {
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        # add_header in a location disables inheritance of the server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_read_timeout 30s;
    }

    location ^~ /_next/static/ {
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
        expires 1y;
        # add_header in a location disables inheritance of the server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://sokar_staging_dashboard;
        include /etc/nginx/snippets/sokar-proxy.conf;
        # add_header in a location disables inheritance of the server headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

# ── api-staging.suppernote.com : API directe ─────────────────
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-staging.suppernote.com;

    ssl_certificate /etc/letsencrypt/live/suppernote.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suppernote.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Rate limits nginx sur les routes Connect sensibles (protection avant Fastify).
    location ~ ^/public/r/[^/]+/hold$ {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
        limit_req zone=connect_hold_staging burst=5 nodelay;
    }

    location ~ ^/public/r/[^/]+/confirm$ {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
        limit_req zone=connect_confirm_staging burst=3 nodelay;
    }

    location ~ ^/public/ {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
        limit_req zone=connect_public_staging burst=20 nodelay;
    }

    location = /api/rgpd/confirm-link {
        access_log off;
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
    }

    location ^~ /voice/stream/ {
        access_log off;
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;

        # Telnyx media streams (long-lived WebSocket).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Ancien domaine de staging : voir la redirection de production dans sokar.conf.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.sokar.tech;
    ssl_certificate /etc/letsencrypt/live/sokar.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sokar.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://staging.suppernote.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-staging.sokar.tech;
    ssl_certificate /etc/letsencrypt/live/sokar.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sokar.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Voir sokar.conf : les émetteurs de webhooks ne suivent pas les redirections.
    location ~ ^/(webhooks/|whatsapp/webhook$|voice/) {
        proxy_pass http://sokar_staging_api;
        include /etc/nginx/snippets/sokar-proxy.conf;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        return 308 https://api-staging.suppernote.com$request_uri;
    }
}
